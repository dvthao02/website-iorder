name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # package.json có "packageManager": setup-node v5 tự bật cache pnpm khi pnpm chưa có → lỗi ngay bước này.
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Validate Caddyfile
        run: >-
          docker run --rm
          --mount "type=bind,src=${{ github.workspace }}/Caddyfile,dst=/etc/caddy/Caddyfile,readonly"
          -e SITE_ADDRESS=example.com
          -e CMS_SITE_ADDRESS=cms.example.com
          -e ANALYTICS_SITE_ADDRESS=stats.example.com
          caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Check migrations
        run: pnpm db:check
      - name: Build applications
        run: pnpm build
