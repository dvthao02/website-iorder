name: iorder-v2

services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - iorder-v2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    image: adobe/s3mock:5.2.3
    mem_limit: 768m
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - iorder-v2-s3-data:/s3mockroot

volumes:
  iorder-v2-postgres-data:
  iorder-v2-s3-data:
