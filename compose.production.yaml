name: iorder-v2

# Docker xoay vòng log của mọi service (tối đa 5 × 20 MB mỗi container) để log không làm đầy ổ đĩa.
# Xem: docker compose --env-file .env.production -f compose.production.yaml logs -f backend
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_NAME: cms
        BACKEND_URL: http://backend:3000
        NEXT_PUBLIC_PUBLISH_WEB_URL: https://${SITE_ADDRESS:?missing}
    image: iorder-v2-cms:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVICE_NAME: cms
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  publish-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_NAME: publish-web
        BACKEND_URL: http://backend:3000
    image: iorder-v2-publish:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVICE_NAME: publish-web
      BACKEND_URL: http://backend:3000
      PUBLISH_WEB_REVALIDATE_SECRET: ${PUBLISH_WEB_REVALIDATE_SECRET:?missing}
      # Để trống tới khi tạo website trong Umami; khi có thì website chèn script /stats/script.js.
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      backend:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_NAME: backend
    image: iorder-v2-backend:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVICE_NAME: backend
      DATABASE_URL: postgresql://${POSTGRES_USER:?missing}:${POSTGRES_PASSWORD:?missing}@db:5432/${POSTGRES_DB:?missing}
      LEAD_IP_HASH_SALT: ${LEAD_IP_HASH_SALT:?missing}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?missing}
      S3_BUCKET: ${S3_BUCKET:?missing}
      S3_ENDPOINT: http://s3:8333
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?missing}
      PUBLISH_WEB_REVALIDATE_URL: http://publish-web:3000/api/internal/revalidate
      PUBLISH_WEB_REVALIDATE_SECRET: ${PUBLISH_WEB_REVALIDATE_SECRET:?missing}
      # Số liệu truy cập cho CMS; thiếu API key hoặc mã website thì CMS báo "chưa kết nối".
      UMAMI_API_URL: http://umami:3000
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed-admin:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    networks:
      - internal
      - storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    image: iorder-v2-migrate:${APP_IMAGE_TAG:-latest}
    restart: "no"
    logging: *default-logging
    command: pnpm db:migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?missing}:${POSTGRES_PASSWORD:?missing}@db:5432/${POSTGRES_DB:?missing}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  seed-admin:
    image: iorder-v2-migrate:${APP_IMAGE_TAG:-latest}
    restart: "no"
    logging: *default-logging
    command: pnpm db:seed:admin
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?missing}:${POSTGRES_PASSWORD:?missing}@db:5432/${POSTGRES_DB:?missing}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrator}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # Sao lưu media theo object; chỉ chạy qua scripts/backup.sh (profile ops, không khởi động khi up).
  backup-media:
    image: iorder-v2-migrate:${APP_IMAGE_TAG:-latest}
    profiles: ["ops"]
    restart: "no"
    logging: *default-logging
    command: ["node", "scripts/backup-media.mjs", "backup", "/backup/media"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?missing}
      S3_BUCKET: ${S3_BUCKET:?missing}
      S3_ENDPOINT: http://s3:8333
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?missing}
    networks:
      - storage

  db:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing}
      POSTGRES_USER: ${POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Umami dùng chung PostgreSQL nhưng database riêng. Job này tạo database nếu chưa có,
  # chạy được cả với volume đã có dữ liệu (init script của Postgres chỉ chạy ở volume rỗng).
  umami-db-init:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: "no"
    logging: *default-logging
    command: ["sh", "-c", "psql -tAc \"select 1 from pg_database where datname = 'umami'\" | grep -q 1 || psql -c 'create database umami'"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?missing}
      PGPASSWORD: ${POSTGRES_PASSWORD:?missing}
      PGDATABASE: ${POSTGRES_DB:?missing}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  umami:
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?missing}:${POSTGRES_PASSWORD:?missing}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?missing}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY:?missing}
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db-init:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  s3:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    logging: *default-logging
    command: ["mini", "-dir=/data", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?missing}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?missing}
      S3_BUCKET: ${S3_BUCKET:?missing}
    volumes:
      - seaweed-data:/data
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      cms:
        condition: service_healthy
      publish-web:
        condition: service_healthy
      backend:
        condition: service_healthy
      # Không phụ thuộc umami: thống kê lỗi chỉ làm hỏng /stats/*, không chặn website khởi động.
    environment:
      CMS_SITE_ADDRESS: ${CMS_SITE_ADDRESS:?missing}
      SITE_ADDRESS: ${SITE_ADDRESS:?missing}
      ANALYTICS_SITE_ADDRESS: ${ANALYTICS_SITE_ADDRESS:?missing}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  postgres-data:
  seaweed-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
  storage:
    driver: bridge
    internal: true
